name: Calendario y noticias LF10

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cal/config.json"
      - "cal/manual.json"
      - "scripts/actualizar-calendario.mjs"

permissions:
  contents: write

concurrency:
  group: calendario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Traer partidos y noticias
        run: node scripts/actualizar-calendario.mjs
        env:
          DIAG: "1"
      - name: Guardar cambios
        run: |
          git config user.name "calendario-lf10"
          git config user.email "calendario-lf10@users.noreply.github.com"
          git add cal/eventos.json cal/noticias.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Calendario: actualización automática $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push
          fi
